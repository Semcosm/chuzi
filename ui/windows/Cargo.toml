[package]
name = "chuzi-native-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.0", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "=1.18.0"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.0", features = ["system-testing"] }
png = "0.17"
