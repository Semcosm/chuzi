[package]
name = "chuzi-native-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.0", features = [
    "raw-window-handle-06",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
] }

[build-dependencies]
slint-build = "=1.18.0"

[target.'cfg(windows)'.build-dependencies]
bindgen = "0.72"
vcpkg = "0.2"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.0", features = ["system-testing"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }
