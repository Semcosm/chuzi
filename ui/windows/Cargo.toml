[package]
name = "chuzi-native-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "=1.18.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials"] }

[build-dependencies]
slint-build = "=1.18.0"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.0", features = ["system-testing"] }
png = "0.17"
