[package]
name = "chuzi-launcher-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
build = "build.rs"
description = "Cross-platform Tauri 2 launcher UI for chuzi"
license = "Apache-2.0"

[lib]
name = "chuzi_launcher_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
