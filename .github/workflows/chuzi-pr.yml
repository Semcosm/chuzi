name: chuzi-pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: chuzi-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chuzi-build:
    name: chuzi-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json

      - name: Verify host toolchain
        shell: bash
        run: |
          go version
          node --version
          npm --version
          cargo --version

      - name: Validate repository and package contracts
        shell: bash
        run: |
          scripts/test_build_contract.sh
          scripts/test_nightly_package.sh
          scripts/test_nightly_artifact_validator.sh
          git diff --check

      - name: Install browser worker dependencies
        shell: bash
        run: npm --prefix browser-worker ci --ignore-scripts

      - name: Test Go, runtime, and worker contracts
        shell: bash
        run: |
          set -euo pipefail
          export CHUZI_TEST_DEBUG=1
          export CHUZI_WORKER_DEBUG=1
          go test -count=1 -v ./...
          scripts/test_runtime.sh
          scripts/test_launcher_consumer.sh
          npm --prefix browser-worker test
          go run ./cmd/service -self-test -worker-command node -worker-script browser-worker/src/worker.mjs

      - name: Build host service and launcher
        shell: bash
        run: |
          set -euo pipefail
          version="dev-${GITHUB_SHA:0:12}"
          output_dir="$RUNNER_TEMP/chuzi-pr"
          mkdir -p "$output_dir"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/Semcosm/chuzi/cmd/service.version=$version" \
            -o "$output_dir/chuzi" ./cmd/service
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "$output_dir/chuzi-launcher" ./cmd/launcher
          npm --prefix browser-worker run build

      - name: Check Rust helper source
        shell: bash
        run: |
          cargo fmt --manifest-path browser-runtime/Cargo.toml -- --check
          cargo test --locked --manifest-path browser-runtime/Cargo.toml -- --nocapture
