name: chuzi-build

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel for a manual build
        required: true
        type: choice
        options:
          - test
          - nightly
        default: test

permissions:
  contents: read

concurrency:
  group: chuzi-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract_checks:
    name: chuzi-build-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate_policy_manifest.sh
          scripts/validate_quality_profile.sh
          scripts/validate_supply_chain_profile.sh
          scripts/validate_action_pinning.sh
          scripts/validate_repository_shape.sh
          scripts/test_build_contract.sh
          scripts/test_nightly_package.sh
          scripts/test_nightly_artifact_validator.sh
          scripts/test_release_catalog.sh
          git diff --check

  go_checks:
    name: chuzi-build-go-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          export CHUZI_TEST_DEBUG=1
          go test -count=1 -v ./...
          go vet ./...
          scripts/test_runtime.sh
          scripts/test_launcher_consumer.sh

  node_checks:
    name: chuzi-build-node-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: Test and build browser worker
        shell: bash
        run: |
          set -euo pipefail
          export CHUZI_WORKER_DEBUG=1
          npm --prefix browser-worker ci --ignore-scripts
          npm --prefix browser-worker test
          scripts/build_worker.sh "$RUNNER_TEMP/chuzi-worker"
          go run ./cmd/service -self-test -worker-command node -worker-script browser-worker/src/worker.mjs
      - name: Upload browser worker component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-worker
          path: ${{ runner.temp }}/chuzi-worker/browser-worker-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  go_build:
    name: chuzi-build-go-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          dispatch_channel="${{ inputs.channel }}"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$dispatch_channel" = "test" ]; then
            version="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Go components
        shell: bash
        run: scripts/build_go_target.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/chuzi-go"
      - name: Upload Go components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-go-${{ matrix.target }}
          path: ${{ runner.temp }}/chuzi-go
          if-no-files-found: error
          retention-days: 1

  windows_slint:
    name: chuzi-build-windows-slint
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [go_build, node_checks]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version
      - name: Check Slint layout at multiple viewports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'chuzi-layout'
          cargo run --manifest-path ui/windows/Cargo.toml --locked `
            --example layout_snapshot -- `
            --output $output
          foreach ($size in @('800x600.png', '1120x760.png', '1440x900.png')) {
            $path = Join-Path $output $size
            if (-not (Test-Path $path)) {
              throw "Missing Slint layout snapshot: $path"
            }
            if ((Get-Item $path).Length -le 0) {
              throw "Empty Slint layout snapshot: $path"
            }
          }
      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $dispatchChannel = "${{ inputs.channel }}"
          if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') {
            $version = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $version = "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0, 12))"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $dispatchChannel -eq 'test') {
            $version = "test-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0, 12))"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0, 12))"
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Assemble Core payload for the Slint package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-go-windows-amd64
          path: ${{ runner.temp }}/chuzi-go
      - name: Download browser worker payload
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-worker
          path: ${{ runner.temp }}/chuzi-worker
      - name: Prepare Core payload files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'chuzi-core-payload'
          if (Test-Path $payload) { Remove-Item -Recurse -Force $payload }
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          & ./scripts/assemble_target.ps1 `
            -Target windows-amd64 `
            -Version "${{ steps.version.outputs.version }}" `
            -GoDir (Join-Path $env:RUNNER_TEMP 'chuzi-go') `
            -WorkerArchive (Join-Path $env:RUNNER_TEMP 'chuzi-worker/browser-worker-dist.tar.gz') `
            -DistRoot (Join-Path $env:RUNNER_TEMP 'chuzi-core-dist')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'chuzi-core-dist/windows-amd64/stage/*') $payload -Recurse -Force
      - name: Build self-contained Slint installer EXE
        shell: pwsh
        run: ./scripts/build_windows_slint.ps1 -Mode InstallerExe -Configuration Release -OutputDir "$env:RUNNER_TEMP\chuzi-ui" -CorePayloadDir "$env:RUNNER_TEMP\chuzi-core-payload"
        env:
          CHUZI_BUILD_VERSION: ${{ steps.version.outputs.version }}
      - name: Test Windows Core named pipe
        shell: pwsh
        run: go test -count=1 -tags=coretransport_native_test ./internal/coretransport
      - name: Smoke test Core install, start, health, and stop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'chuzi-core-payload'
          $root = Join-Path $env:RUNNER_TEMP 'chuzi-core-lifecycle'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $launcher = Join-Path $payload 'chuzi-launcher.exe'
          $manifest = Join-Path $payload 'release-manifest.json'
          $installOutput = & $launcher `
            -root $root `
            -source-root $payload `
            -manifest $manifest `
            -command component-install `
            -item service 2>&1
          if ($LASTEXITCODE -ne 0) {
            $installOutput | Out-String | Write-Error
            throw "Core component installation failed with exit code $LASTEXITCODE"
          }
          $service = Join-Path $root 'chuzi.exe'
          if (-not (Test-Path $service)) { throw "Core service was not installed: $service" }
          $configPath = Join-Path $root 'core-ci-config.json'
          @{
            data_dir = $root
            health = @{ listen = '127.0.0.1:18080' }
            observability = @{ log_path = (Join-Path $root 'core-ci.log') }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
          $process = Start-Process -FilePath $service -ArgumentList @('-config', $configPath) -WorkingDirectory $root -PassThru
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $log = Join-Path $root 'core-ci.log'
                if (Test-Path $log) { Get-Content $log -Tail 80 }
                throw "Core exited during lifecycle smoke test with code $($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/healthz' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $healthy) { throw 'Core did not become healthy during lifecycle smoke test' }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Smoke test installed Slint client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'chuzi-ui\ChuziSetup.exe'
          $installDir = Join-Path ${env:ProgramFiles} 'Chuzi'
          Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait
          $exe = Join-Path $installDir 'Chuzi.Native.Windows.exe'
          if (-not (Test-Path $exe)) { throw "Installed Slint executable is missing: $exe" }
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Installed Slint smoke test failed with exit code $LASTEXITCODE" }
      - name: Smoke test Core payload shipped inside installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path ${env:ProgramFiles} 'Chuzi'
          $installedPayload = Join-Path $installDir 'CorePayload'
          if (-not (Test-Path (Join-Path $installedPayload 'chuzi-launcher.exe'))) {
            throw "Installed Slint package does not contain CorePayload launcher: $installedPayload"
          }
          $root = Join-Path $env:RUNNER_TEMP 'chuzi-installed-payload-core'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $launcher = Join-Path $installedPayload 'chuzi-launcher.exe'
          $manifest = Join-Path $installedPayload 'release-manifest.json'
          $installOutput = & $launcher -root $root -source-root $installedPayload -manifest $manifest -command component-install -item service 2>&1
          if ($LASTEXITCODE -ne 0) {
            $installOutput | Out-String | Write-Error
            throw "Installed Core payload installation failed with exit code $LASTEXITCODE"
          }
          $service = Join-Path $root 'chuzi.exe'
          if (-not (Test-Path $service)) { throw "Installed Core service is missing: $service" }
          $configPath = Join-Path $root 'core-installed-config.json'
          @{
            data_dir = $root
            health = @{ listen = '127.0.0.1:18081' }
            observability = @{ log_path = (Join-Path $root 'core-installed.log') }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
          $process = Start-Process -FilePath $service -ArgumentList @('-config', $configPath) -WorkingDirectory $root -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Installed Core exited with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18081/healthz' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $healthy) { throw 'Installed Core did not become healthy' }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload Windows installer EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chuzi-windows-installer-exe
          path: |
            ${{ runner.temp }}/chuzi-ui/*.exe
            ${{ runner.temp }}/chuzi-ui/*.sha256
          if-no-files-found: error
          retention-days: 7

  assemble_target:
    name: chuzi-build-${{ matrix.target }}
    needs: [go_build, node_checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-go-${{ matrix.target }}
          path: ${{ runner.temp }}/chuzi-go
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-worker
          path: ${{ runner.temp }}/chuzi-worker
      - name: Resolve build version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dispatchChannel = "${{ inputs.channel }}"
          $version = if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') { $env:GITHUB_REF_NAME } elseif ($env:GITHUB_EVENT_NAME -eq "schedule") { "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,12))" } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $dispatchChannel -eq "test") { "test-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,12))" } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,12))" } else { "dev-$($env:GITHUB_SHA.Substring(0,12))" }
          "CHUZI_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve build version on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dispatch_channel="${{ inputs.channel }}"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$GITHUB_REF_NAME"; elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"; elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$dispatch_channel" = "test" ]; then version="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"; elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"; else version="dev-${GITHUB_SHA:0:12}"; fi
          echo "CHUZI_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Assemble target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assemble_target.ps1 -Target "${{ matrix.target }}" -Version "$env:CHUZI_BUILD_VERSION" -GoDir "$env:RUNNER_TEMP\chuzi-go" -WorkerArchive "$env:RUNNER_TEMP\chuzi-worker\browser-worker-dist.tar.gz" -DistRoot "$env:GITHUB_WORKSPACE\dist"
      - name: Assemble target on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/assemble_target.sh "${{ matrix.target }}" "$CHUZI_BUILD_VERSION" "$RUNNER_TEMP/chuzi-go" "$RUNNER_TEMP/chuzi-worker/browser-worker-dist.tar.gz" "$GITHUB_WORKSPACE/dist"
      - name: Package target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Target "${{ matrix.target }}" -Version "$env:CHUZI_BUILD_VERSION"
      - name: Package target on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "$CHUZI_BUILD_VERSION"
      - name: Verify Unix artifact checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then checksum_command=(sha256sum -c); elif command -v shasum >/dev/null 2>&1; then checksum_command=(shasum -a 256 -c); else echo "no SHA256 checksum verifier is available" >&2; exit 1; fi
          for checksum in dist/*.tar.gz.sha256; do (cd "$(dirname "$checksum")" && "${checksum_command[@]}" "$(basename "$checksum")"); done
      - name: Verify target release index
        shell: bash
        run: |
          index="$(find dist -maxdepth 1 -type f -name "*-${{ matrix.target }}.index.json" -print -quit)"
          test -n "$index"
          if [ "${{ runner.os }}" = "Windows" ]; then python scripts/validate_release_index.py --index "$index" --dist dist; else python3 scripts/validate_release_index.py --index "$index" --dist dist; fi
          case "$CHUZI_BUILD_VERSION" in
            nightly-*) python3 scripts/validate_nightly_artifact.py --artifact dist --target "${{ matrix.target }}" --commit "$GITHUB_SHA" --version "$CHUZI_BUILD_VERSION" --channel nightly ;;
            test-*) python3 scripts/validate_nightly_artifact.py --artifact dist --target "${{ matrix.target }}" --commit "$GITHUB_SHA" --version "$CHUZI_BUILD_VERSION" --channel test ;;
            v[0-9]*.[0-9]*.[0-9]*) python3 scripts/validate_nightly_artifact.py --artifact dist --target "${{ matrix.target }}" --commit "$GITHUB_SHA" --version "$CHUZI_BUILD_VERSION" --channel stable ;;
          esac
      - name: Upload nightly target bundle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chuzi-nightly-${{ matrix.target }}
          path: |
            dist/chuzi-*.tar.gz
            dist/chuzi-*.zip
            dist/chuzi-*.sha256
            dist/chuzi-*.manifest.json
            dist/chuzi-*.index.json
            dist/chuzi-*.index.json.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Show artifact digest
        shell: bash
        run: cat dist/*.sha256

  artifact_integration:
    name: chuzi-build-artifact-integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: assemble_target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: chuzi-nightly-*
          path: dist
          merge-multiple: false
      - name: Validate all target artifacts together
        shell: bash
        run: |
          set -euo pipefail
          dispatch_channel="${{ inputs.channel }}"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
            channel=stable
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$dispatch_channel" = "test" ]; then
            version="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
            channel=test
          else
            version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
            channel=nightly
          fi
          for target in windows-amd64 linux-amd64 linux-arm64 darwin-arm64; do
            artifact_dir="dist/chuzi-nightly-$target"
            index="$artifact_dir/chuzi-${version}-${target}.index.json"
            test -f "$index"
            python3 scripts/validate_release_index.py --index "$index" --dist "$artifact_dir"
            python3 scripts/validate_nightly_artifact.py --artifact "$artifact_dir" --target "$target" --commit "$GITHUB_SHA" --version "$version" --channel "$channel"
          done
          echo "all target artifacts validated for $GITHUB_SHA"

  chuzi_build:
    name: chuzi-build
    if: always()
    needs: [contract_checks, go_checks, node_checks, go_build, windows_slint, assemble_target, artifact_integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build stage
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.contract_checks.result }}" \
            "${{ needs.go_checks.result }}" \
            "${{ needs.node_checks.result }}" \
            "${{ needs.go_build.result }}" \
            "${{ needs.windows_slint.result }}" \
            "${{ needs.assemble_target.result }}"; do
            test "$result" = success || { echo "build stage did not succeed: $result" >&2; exit 1; }
          done
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            schedule:*|workflow_dispatch:*|push:refs/tags/v*)
              test "${{ needs.artifact_integration.result }}" = success || { echo "artifact integration did not succeed" >&2; exit 1; }
              ;;
            *)
              test "${{ needs.artifact_integration.result }}" = skipped || { echo "unexpected artifact integration result" >&2; exit 1; }
              ;;
          esac
          echo "all chuzi build stages passed"

  stable-release:
    name: stable-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assemble_target, artifact_integration, chuzi_build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore annotated release tag ref
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          git cat-file -e "$tag_ref^{tag}"
          test "$(git rev-parse "$tag_ref^{commit}")" = "$GITHUB_SHA"
      - name: Validate signed release tag and notes
        shell: bash
        run: scripts/validate_release_tag.sh "$GITHUB_REF_NAME"
      - name: Download target build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: chuzi-*
          path: dist
          merge-multiple: true
      - name: Require release signing inputs
        shell: bash
        env:
          CHUZI_RELEASE_SIGNING_KEY: ${{ secrets.CHUZI_RELEASE_SIGNING_KEY }}
          CHUZI_RELEASE_SIGNER: ${{ vars.CHUZI_RELEASE_SIGNER }}
        run: |
          test -n "$CHUZI_RELEASE_SIGNING_KEY" || { echo 'CHUZI_RELEASE_SIGNING_KEY is required' >&2; exit 1; }
          test -n "$CHUZI_RELEASE_SIGNER" || { echo 'CHUZI_RELEASE_SIGNER repository variable is required' >&2; exit 1; }
      - name: Sign and verify release attestations
        shell: bash
        env:
          CHUZI_RELEASE_SIGNING_KEY: ${{ secrets.CHUZI_RELEASE_SIGNING_KEY }}
          CHUZI_RELEASE_SIGNER: ${{ vars.CHUZI_RELEASE_SIGNER }}
          CHUZI_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/chuzi-release-signing-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$CHUZI_RELEASE_SIGNING_KEY" > "$key_file"
          mkdir -p dist/attestations
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            unsigned="dist/attestations/$name.json"
            signed="dist/attestations/$name.signed.json"
            scripts/generate_release_attestation.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$artifact" "github-actions/$GITHUB_WORKFLOW" "$unsigned"
            scripts/sign_release_attestation.sh "$unsigned" "$key_file" "$CHUZI_RELEASE_SIGNER" "$signed"
            rm -f "$unsigned"
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)
          scripts/verify_release_bundle.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" dist dist/attestations "$CHUZI_RELEASE_REPOSITORY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_assets=()
          while IFS= read -r -d '' asset; do release_assets+=("$asset"); done < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          while IFS= read -r -d '' asset; do release_assets+=("$asset"); done < <(find dist/attestations -maxdepth 1 -type f -name '*.signed.json' -print0 | sort -z)
          [ "${#release_assets[@]}" -gt 0 ] || { echo 'no release assets were produced' >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "chuzi $GITHUB_REF_NAME" --notes-file "releases/$GITHUB_REF_NAME.md" "${release_assets[@]}"

  publish-release-catalog:
    name: publish-release-catalog
    if: (github.event_name == 'workflow_dispatch' && inputs.channel == 'test') || startsWith(github.ref, 'refs/tags/v')
    needs: [assemble_target, artifact_integration, chuzi_build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: chuzi-nightly-*
          path: dist
          merge-multiple: false
      - name: Resolve catalog release metadata
        shell: bash
        run: |
          set -euo pipefail
          dispatch_channel="${{ inputs.channel }}"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
            channel=stable
          elif [ "$dispatch_channel" = "test" ]; then
            version="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
            channel=test
          else
            echo 'catalog publishing requires a test dispatch or stable tag' >&2
            exit 1
          fi
          {
            echo "CHUZI_CATALOG_VERSION=$version"
            echo "CHUZI_CATALOG_CHANNEL=$channel"
          } >> "$GITHUB_ENV"
      - name: Validate target artifacts for catalog
        shell: bash
        run: |
          set -euo pipefail
          for target in windows-amd64 linux-amd64 linux-arm64 darwin-arm64; do
            artifact_dir="dist/chuzi-nightly-$target"
            index="$artifact_dir/chuzi-${CHUZI_CATALOG_VERSION}-${target}.index.json"
            test -f "$index"
            python3 scripts/validate_release_index.py --index "$index" --dist "$artifact_dir"
            python3 scripts/validate_nightly_artifact.py --artifact "$artifact_dir" --target "$target" --commit "$GITHUB_SHA" --version "$CHUZI_CATALOG_VERSION" --channel "$CHUZI_CATALOG_CHANNEL"
          done
      - name: Prepare release-catalog worktree
        shell: bash
        run: |
          set -euo pipefail
          catalog_dir="$RUNNER_TEMP/release-catalog"
          git fetch origin refs/heads/release-catalog:refs/remotes/origin/release-catalog || true
          if git show-ref --verify --quiet refs/remotes/origin/release-catalog; then
            git worktree add "$catalog_dir" refs/remotes/origin/release-catalog
          else
            git worktree add --detach "$catalog_dir" HEAD
            git -C "$catalog_dir" switch --orphan release-catalog
            # The orphan worktree starts with the source checkout still on
            # disk. Remove it before `git add -A`, otherwise the catalog branch
            # would accidentally publish the entire repository.
            git -C "$catalog_dir" clean -fdx
          fi
          echo "CHUZI_CATALOG_DIR=$catalog_dir" >> "$GITHUB_ENV"
      - name: Publish catalog files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_release_catalog.py \
            --artifact-root dist \
            --output-root "$CHUZI_CATALOG_DIR" \
            --channel "$CHUZI_CATALOG_CHANNEL" \
            --version "$CHUZI_CATALOG_VERSION" \
            --commit "$GITHUB_SHA" \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release-catalog" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Commit and push release catalog
        shell: bash
        run: |
          set -euo pipefail
          git -C "$CHUZI_CATALOG_DIR" config user.name "github-actions[bot]"
          git -C "$CHUZI_CATALOG_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$CHUZI_CATALOG_DIR" add -A
          if git -C "$CHUZI_CATALOG_DIR" diff --cached --quiet; then
            echo 'release catalog already contains this version'
            exit 0
          fi
          git -C "$CHUZI_CATALOG_DIR" commit -m "chore(release): publish $CHUZI_CATALOG_CHANNEL $CHUZI_CATALOG_VERSION"
          git -C "$CHUZI_CATALOG_DIR" push origin HEAD:release-catalog
