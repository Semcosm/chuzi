name: chuzi-build

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-matrix:
    name: chuzi-build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            browser-worker/package-lock.json

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev weston xvfb xauth dbus-x11

      - name: Verify host toolchain
        shell: bash
        run: |
          go version
          node --version
          npm --version
          cargo --version

      - name: Verify native Linux ARM64 runner
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          test "$(uname -m)" = "aarch64"
          test "$(node -p 'process.arch')" = "arm64"
          test "$(go env GOARCH)" = "arm64"

      - name: Validate build contract
        shell: bash
        run: scripts/test_build_contract.sh

      - name: Validate nightly package contract
        shell: bash
        run: scripts/test_nightly_package.sh

      - name: Build service and worker on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') { $env:GITHUB_REF_NAME } elseif ($env:GITHUB_EVENT_NAME -eq "schedule" -or $env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,12))" } else { "dev-$($env:GITHUB_SHA.Substring(0,12))" }
          ./scripts/build.ps1 -Target "${{ matrix.target }}" -Version $version

      - name: Build service and worker on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$GITHUB_REF_NAME"; elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"; else version="dev-${GITHUB_SHA:0:12}"; fi
          scripts/build.sh "${{ matrix.target }}" "$version"

      - name: Test Go service and worker contract
        shell: bash
        run: |
          set -euo pipefail
          export CHUZI_TEST_DEBUG=1
          export CHUZI_WORKER_DEBUG=1

          # Keep long-running contract tests observable without imposing a business timeout.
          phase_file="$(mktemp)"
          watchdog_pid=""
          cleanup_debug() {
            if [ -n "${watchdog_pid:-}" ]; then
              kill "$watchdog_pid" 2>/dev/null || true
              wait "$watchdog_pid" 2>/dev/null || true
            fi
            rm -f "$phase_file"
          }
          trap cleanup_debug EXIT

          now() {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
          }

          dump_debug_state() {
            current_phase="$(cat "$phase_file" 2>/dev/null || printf '%s' 'unknown')"
            printf '[contract-debug] %s phase=%s\n' "$(now)" "$current_phase"
            printf '[contract-debug] process snapshot\n'
            if command -v ps >/dev/null 2>&1; then
              ps -ef 2>&1 || true
            elif command -v tasklist.exe >/dev/null 2>&1; then
              tasklist.exe 2>&1 || true
            else
              printf '[contract-debug] no process-list command available\n'
            fi
          }

          debug_watchdog() {
            while sleep 15; do
              dump_debug_state
            done
          }
          debug_watchdog &
          watchdog_pid=$!

          run_phase() {
            phase_name="$1"
            shift
            printf '%s\n' "$phase_name" >"$phase_file"
            phase_started="$(now)"
            printf '[contract] START %s at %s\n' "$phase_name" "$phase_started"
            phase_status=0
            if "$@"; then
              phase_status=0
            else
              phase_status=$?
            fi
            phase_finished="$(now)"
            printf '[contract] END %s at %s exit=%s\n' "$phase_name" "$phase_finished" "$phase_status"
            if [ "$phase_status" -ne 0 ]; then
              printf '[contract] FAILURE %s diagnostics\n' "$phase_name" >&2
              dump_debug_state >&2
            fi
            return "$phase_status"
          }

          run_phase 'go-test' go test -count=1 -v ./...
          run_phase 'runtime-integration-test' scripts/test_runtime.sh
          run_phase 'node-test' npm --prefix browser-worker test
          run_phase 'launcher-consumer-test' scripts/test_launcher_consumer.sh
          run_phase 'nightly-artifact-validator-test' scripts/test_nightly_artifact_validator.sh
          run_phase 'cargo-fmt-check' cargo fmt --manifest-path browser-runtime/Cargo.toml -- --check
          run_phase 'cargo-test' cargo test --locked --manifest-path browser-runtime/Cargo.toml -- --nocapture
          run_phase 'service-self-test' go run ./cmd/service -self-test -worker-command node -worker-script browser-worker/src/worker.mjs
          printf '%s\n' 'complete' >"$phase_file"
          printf '[contract] all phases passed at %s\n' "$(now)"

      - name: Test native browser runtime helper contract
        if: runner.os == 'Windows' || runner.os == 'macOS' || runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --locked --manifest-path browser-runtime/Cargo.toml --features desktop-webview
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "dist/${{ matrix.target }}/stage/chuzi-browser-runtime.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            test -f "dist/${{ matrix.target }}/stage/chuzi-browser-runtime"
          else
            test -f "dist/${{ matrix.target }}/stage/chuzi-browser-runtime"
          fi

      - name: Smoke test Linux WebKitGTK on X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          profile_dir="$(mktemp -d)"
          output_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -rf "$profile_dir" "$output_file" "$error_file"' EXIT
          run_x11() {
            timeout 30s xvfb-run -a dbus-run-session -- env GDK_BACKEND=x11 WINIT_UNIX_BACKEND=x11 \
              WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              LIBGL_ALWAYS_SOFTWARE=1 \
              "./dist/${{ matrix.target }}/stage/chuzi-browser-runtime"
          }
          printf '%s\n' \
            '{"protocol":"v1","id":"hello-x11","type":"hello"}' \
            "{\"protocol\":\"v1\",\"id\":\"start-x11\",\"type\":\"session_start\",\"payload\":{\"session_id\":\"session-x11\",\"account_id\":\"account-x11\",\"request_id\":\"request-x11\",\"profile_dir\":\"$profile_dir\"}}" \
            | run_x11 >"$output_file" 2>"$error_file" || {
              status=$?
              echo "Linux X11 helper exited with status $status" >&2
              sed -n '1,160p' "$output_file" >&2
              sed -n '1,160p' "$error_file" >&2
              exit "$status"
            }
          grep -Fq 'browser-runtime.linux-x11' "$output_file"
          grep -Fq 'local-test-page-ready' "$output_file"

      - name: Smoke test Linux WebKitGTK on Wayland
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime_dir="$(mktemp -d)"
          profile_dir="$(mktemp -d)"
          weston_log="$(mktemp)"
          output_file="$(mktemp)"
          error_file="$(mktemp)"
          chmod 700 "$runtime_dir"
          weston_pid=""
          cleanup() {
            if [ -n "$weston_pid" ] && kill -0 "$weston_pid" 2>/dev/null; then
              kill "$weston_pid" 2>/dev/null || true
              wait "$weston_pid" 2>/dev/null || true
            fi
            rm -rf "$runtime_dir" "$profile_dir" "$weston_log" "$output_file" "$error_file"
          }
          trap cleanup EXIT
          XDG_RUNTIME_DIR="$runtime_dir" weston \
            --backend=headless-backend.so --renderer=pixman --socket=wayland-1 --idle-time=0 \
            >"$weston_log" 2>&1 &
          weston_pid=$!
          for _ in $(seq 1 50); do
            if [ -S "$runtime_dir/wayland-1" ]; then
              break
            fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              sed -n '1,160p' "$weston_log" >&2
              exit 1
            fi
            sleep 0.2
          done
          test -S "$runtime_dir/wayland-1"
          printf '%s\n' \
            '{"protocol":"v1","id":"hello-wayland","type":"hello"}' \
            "{\"protocol\":\"v1\",\"id\":\"start-wayland\",\"type\":\"session_start\",\"payload\":{\"session_id\":\"session-wayland\",\"account_id\":\"account-wayland\",\"request_id\":\"request-wayland\",\"profile_dir\":\"$profile_dir\"}}" \
            | timeout 30s dbus-run-session -- env XDG_RUNTIME_DIR="$runtime_dir" WAYLAND_DISPLAY=wayland-1 \
                XDG_SESSION_TYPE=wayland GDK_BACKEND=wayland WINIT_UNIX_BACKEND=wayland \
                WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
                LIBGL_ALWAYS_SOFTWARE=1 \
                "./dist/${{ matrix.target }}/stage/chuzi-browser-runtime" >"$output_file" 2>"$error_file" || {
              status=$?
              echo "Linux Wayland helper exited with status $status" >&2
              sed -n '1,160p' "$output_file" >&2
              sed -n '1,160p' "$error_file" >&2
              sed -n '1,160p' "$weston_log" >&2
              exit "$status"
            }
          grep -Fq 'browser-runtime.linux-wayland' "$output_file"
          grep -Fq 'local-test-page-ready' "$output_file"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') { $env:GITHUB_REF_NAME } elseif ($env:GITHUB_EVENT_NAME -eq "schedule" -or $env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,12))" } else { "dev-$($env:GITHUB_SHA.Substring(0,12))" }
          ./scripts/package.ps1 -Target "${{ matrix.target }}" -Version $version

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$GITHUB_REF_NAME"; elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"; else version="dev-${GITHUB_SHA:0:12}"; fi
          scripts/package.sh "${{ matrix.target }}" "$version"

      - name: Verify Unix artifact checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            checksum_command=(sha256sum -c)
          elif command -v shasum >/dev/null 2>&1; then
            checksum_command=(shasum -a 256 -c)
          else
            echo "no SHA256 checksum verifier is available" >&2
            exit 1
          fi
          for checksum in dist/*.tar.gz.sha256; do
            (cd "$(dirname "$checksum")" && "${checksum_command[@]}" "$(basename "$checksum")")
          done

      - name: Verify release index
        shell: bash
        run: |
          index="$(find dist -maxdepth 1 -type f -name '*-${{ matrix.target }}.index.json' -print -quit)"
          test -n "$index"
          if [ "${{ runner.os }}" = "Windows" ]; then python scripts/validate_release_index.py --index "$index" --dist dist; else python3 scripts/validate_release_index.py --index "$index" --dist dist; fi

      - name: Upload nightly target bundle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chuzi-nightly-${{ matrix.target }}
          path: |
            dist/chuzi-*.tar.gz
            dist/chuzi-*.zip
            dist/chuzi-*.sha256
            dist/chuzi-*.manifest.json
            dist/chuzi-*.index.json
            dist/chuzi-*.index.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Show artifact digest
        shell: bash
        run: cat dist/*.sha256

  chuzi-build:
    name: chuzi-build
    if: always()
    needs: build-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every target build
        shell: bash
        run: |
          if [ "${{ needs.build-matrix.result }}" != "success" ]; then
            echo "one or more chuzi target builds failed" >&2
            exit 1
          fi
          echo "all chuzi target builds passed"

  stable-release:
    name: stable-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix, chuzi-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore annotated release tag ref
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          git cat-file -e "$tag_ref^{tag}"
          test "$(git rev-parse "$tag_ref^{commit}")" = "$GITHUB_SHA"
      - name: Validate signed release tag and notes
        shell: bash
        run: scripts/validate_release_tag.sh "$GITHUB_REF_NAME"
      - name: Download target build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: chuzi-*
          path: dist
          merge-multiple: true
      - name: Require release signing inputs
        shell: bash
        env:
          CHUZI_RELEASE_SIGNING_KEY: ${{ secrets.CHUZI_RELEASE_SIGNING_KEY }}
          CHUZI_RELEASE_SIGNER: ${{ vars.CHUZI_RELEASE_SIGNER }}
        run: |
          test -n "$CHUZI_RELEASE_SIGNING_KEY" || { echo 'CHUZI_RELEASE_SIGNING_KEY is required' >&2; exit 1; }
          test -n "$CHUZI_RELEASE_SIGNER" || { echo 'CHUZI_RELEASE_SIGNER repository variable is required' >&2; exit 1; }
      - name: Sign and verify release attestations
        shell: bash
        env:
          CHUZI_RELEASE_SIGNING_KEY: ${{ secrets.CHUZI_RELEASE_SIGNING_KEY }}
          CHUZI_RELEASE_SIGNER: ${{ vars.CHUZI_RELEASE_SIGNER }}
          CHUZI_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/chuzi-release-signing-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$CHUZI_RELEASE_SIGNING_KEY" > "$key_file"
          mkdir -p dist/attestations
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            unsigned="dist/attestations/$name.json"
            signed="dist/attestations/$name.signed.json"
            scripts/generate_release_attestation.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$artifact" "github-actions/$GITHUB_WORKFLOW" "$unsigned"
            scripts/sign_release_attestation.sh "$unsigned" "$key_file" "$CHUZI_RELEASE_SIGNER" "$signed"
            rm -f "$unsigned"
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)
          scripts/verify_release_bundle.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" dist dist/attestations "$CHUZI_RELEASE_REPOSITORY"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=()
          while IFS= read -r -d '' asset; do
            release_assets+=("$asset")
          done < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          while IFS= read -r -d '' asset; do
            release_assets+=("$asset")
          done < <(find dist/attestations -maxdepth 1 -type f -name '*.signed.json' -print0 | sort -z)
          [ "${#release_assets[@]}" -gt 0 ] || { echo 'no release assets were produced' >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "chuzi $GITHUB_REF_NAME" --notes-file "releases/$GITHUB_REF_NAME.md" "${release_assets[@]}"
