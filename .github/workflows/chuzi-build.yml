name: chuzi-build

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chuzi-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract_checks:
    name: chuzi-build-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate_policy_manifest.sh
          scripts/validate_quality_profile.sh
          scripts/validate_supply_chain_profile.sh
          scripts/validate_action_pinning.sh
          scripts/validate_repository_shape.sh
          scripts/test_build_contract.sh
          scripts/test_nightly_package.sh
          scripts/test_nightly_artifact_validator.sh
          git diff --check

  go_checks:
    name: chuzi-build-go-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          export CHUZI_TEST_DEBUG=1
          go test -count=1 -v ./...
          go vet ./...
          scripts/test_runtime.sh
          scripts/test_launcher_consumer.sh

  node_checks:
    name: chuzi-build-node-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: Test and build browser worker
        shell: bash
        run: |
          set -euo pipefail
          export CHUZI_WORKER_DEBUG=1
          npm --prefix browser-worker ci --ignore-scripts
          npm --prefix browser-worker test
          scripts/build_worker.sh "$RUNNER_TEMP/chuzi-worker"
          go run ./cmd/service -self-test -worker-command node -worker-script browser-worker/src/worker.mjs
      - name: Upload browser worker component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-worker
          path: ${{ runner.temp }}/chuzi-worker/browser-worker-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  rust_checks:
    name: chuzi-build-rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Test Rust protocol helper
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path browser-runtime/Cargo.toml -- --check
          cargo test --locked --manifest-path browser-runtime/Cargo.toml -- --nocapture

  go_build:
    name: chuzi-build-go-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Go components
        shell: bash
        run: scripts/build_go_target.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/chuzi-go"
      - name: Upload Go components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-go-${{ matrix.target }}
          path: ${{ runner.temp }}/chuzi-go
          if-no-files-found: error
          retention-days: 1

  runtime_build:
    name: chuzi-build-runtime-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: matrix.target == 'linux-arm64'
        with:
          node-version: 20
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev weston xvfb xauth dbus-x11
      - name: Verify native Linux ARM64 runner
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          test "$(uname -m)" = "aarch64"
          test "$(node -p 'process.arch')" = "arm64"
      - name: Build native browser runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_runtime.ps1 -Target "${{ matrix.target }}" -OutputDir "$env:RUNNER_TEMP\chuzi-runtime\${{ matrix.target }}"
      - name: Build native browser runtime on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build_runtime.sh "${{ matrix.target }}" "$RUNNER_TEMP/chuzi-runtime/${{ matrix.target }}"
      - name: Test native browser runtime helper contract
        shell: bash
        run: cargo test --locked --manifest-path browser-runtime/Cargo.toml --features desktop-webview
      - name: Smoke test Linux WebKitGTK on X11 and Wayland
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/test_desktop_runtime_smoke.sh "$RUNNER_TEMP/chuzi-runtime/${{ matrix.target }}/chuzi-browser-runtime"
      - name: Upload native browser runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/chuzi-runtime/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  windows_ui:
    name: chuzi-build-windows-ui
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') {
            $version = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'schedule' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0, 12))"
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and package WinUI 3 client
        shell: pwsh
        run: ./scripts/build_windows_ui.ps1 -Configuration Release -OutputDir "$env:RUNNER_TEMP\chuzi-ui"
        env:
          CHUZI_BUILD_VERSION: ${{ steps.version.outputs.version }}
      - name: Test Windows Core named pipe
        shell: pwsh
        run: go test -count=1 -tags=coretransport_native_test ./internal/coretransport
      - name: Upload Windows native client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-ui-windows
          path: ${{ runner.temp }}/chuzi-ui/chuzi-native-windows-*.zip*
          if-no-files-found: error
          retention-days: 1

  assemble_target:
    name: chuzi-build-${{ matrix.target }}
    needs: [go_build, node_checks, runtime_build, windows_ui]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-go-${{ matrix.target }}
          path: ${{ runner.temp }}/chuzi-go
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-worker
          path: ${{ runner.temp }}/chuzi-worker
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ci-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/chuzi-runtime
      - name: Resolve build version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') { $env:GITHUB_REF_NAME } elseif ($env:GITHUB_EVENT_NAME -eq "schedule" -or $env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "nightly-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,12))" } else { "dev-$($env:GITHUB_SHA.Substring(0,12))" }
          "CHUZI_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve build version on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$GITHUB_REF_NAME"; elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"; else version="dev-${GITHUB_SHA:0:12}"; fi
          echo "CHUZI_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Assemble target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assemble_target.ps1 -Target "${{ matrix.target }}" -Version "$env:CHUZI_BUILD_VERSION" -GoDir "$env:RUNNER_TEMP\chuzi-go" -WorkerArchive "$env:RUNNER_TEMP\chuzi-worker\browser-worker-dist.tar.gz" -RuntimeBinary "$env:RUNNER_TEMP\chuzi-runtime\chuzi-browser-runtime.exe" -DistRoot "$env:GITHUB_WORKSPACE\dist"
      - name: Assemble target on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/assemble_target.sh "${{ matrix.target }}" "$CHUZI_BUILD_VERSION" "$RUNNER_TEMP/chuzi-go" "$RUNNER_TEMP/chuzi-worker/browser-worker-dist.tar.gz" "$RUNNER_TEMP/chuzi-runtime/chuzi-browser-runtime" "$GITHUB_WORKSPACE/dist"
      - name: Package target on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Target "${{ matrix.target }}" -Version "$env:CHUZI_BUILD_VERSION"
      - name: Package target on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "$CHUZI_BUILD_VERSION"
      - name: Verify Unix artifact checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then checksum_command=(sha256sum -c); elif command -v shasum >/dev/null 2>&1; then checksum_command=(shasum -a 256 -c); else echo "no SHA256 checksum verifier is available" >&2; exit 1; fi
          for checksum in dist/*.tar.gz.sha256; do (cd "$(dirname "$checksum")" && "${checksum_command[@]}" "$(basename "$checksum")"); done
      - name: Verify target release index
        shell: bash
        run: |
          index="$(find dist -maxdepth 1 -type f -name "*-${{ matrix.target }}.index.json" -print -quit)"
          test -n "$index"
          if [ "${{ runner.os }}" = "Windows" ]; then python scripts/validate_release_index.py --index "$index" --dist dist; else python3 scripts/validate_release_index.py --index "$index" --dist dist; fi
          case "$CHUZI_BUILD_VERSION" in
            nightly-*) python3 scripts/validate_nightly_artifact.py --artifact dist --target "${{ matrix.target }}" --commit "$GITHUB_SHA" --version "$CHUZI_BUILD_VERSION" --channel nightly ;;
            v[0-9]*.[0-9]*.[0-9]*) python3 scripts/validate_nightly_artifact.py --artifact dist --target "${{ matrix.target }}" --commit "$GITHUB_SHA" --version "$CHUZI_BUILD_VERSION" --channel stable ;;
          esac
      - name: Upload nightly target bundle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chuzi-nightly-${{ matrix.target }}
          path: |
            dist/chuzi-*.tar.gz
            dist/chuzi-*.zip
            dist/chuzi-*.sha256
            dist/chuzi-*.manifest.json
            dist/chuzi-*.index.json
            dist/chuzi-*.index.json.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Show artifact digest
        shell: bash
        run: cat dist/*.sha256

  artifact_integration:
    name: chuzi-build-artifact-integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: assemble_target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: chuzi-nightly-*
          path: dist
          merge-multiple: false
      - name: Validate all target artifacts together
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$GITHUB_REF_NAME"
            channel=stable
          else
            version="nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
            channel=nightly
          fi
          for target in windows-amd64 linux-amd64 linux-arm64 darwin-arm64; do
            artifact_dir="dist/chuzi-nightly-$target"
            index="$artifact_dir/chuzi-${version}-${target}.index.json"
            test -f "$index"
            python3 scripts/validate_release_index.py --index "$index" --dist "$artifact_dir"
            python3 scripts/validate_nightly_artifact.py --artifact "$artifact_dir" --target "$target" --commit "$GITHUB_SHA" --version "$version" --channel "$channel"
          done
          echo "all target artifacts validated for $GITHUB_SHA"

  chuzi_build:
    name: chuzi-build
    if: always()
    needs: [contract_checks, go_checks, node_checks, rust_checks, go_build, runtime_build, windows_ui, assemble_target, artifact_integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build stage
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.contract_checks.result }}" \
            "${{ needs.go_checks.result }}" \
            "${{ needs.node_checks.result }}" \
            "${{ needs.rust_checks.result }}" \
            "${{ needs.go_build.result }}" \
            "${{ needs.runtime_build.result }}" \
            "${{ needs.windows_ui.result }}" \
            "${{ needs.assemble_target.result }}"; do
            test "$result" = success || { echo "build stage did not succeed: $result" >&2; exit 1; }
          done
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            schedule:*|workflow_dispatch:*|push:refs/tags/v*)
              test "${{ needs.artifact_integration.result }}" = success || { echo "artifact integration did not succeed" >&2; exit 1; }
              ;;
            *)
              test "${{ needs.artifact_integration.result }}" = skipped || { echo "unexpected artifact integration result" >&2; exit 1; }
              ;;
          esac
          echo "all chuzi build stages passed"

  stable-release:
    name: stable-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assemble_target, artifact_integration, chuzi_build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore annotated release tag ref
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          git cat-file -e "$tag_ref^{tag}"
          test "$(git rev-parse "$tag_ref^{commit}")" = "$GITHUB_SHA"
      - name: Validate signed release tag and notes
        shell: bash
        run: scripts/validate_release_tag.sh "$GITHUB_REF_NAME"
      - name: Download target build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: chuzi-*
          path: dist
          merge-multiple: true
      - name: Require release signing inputs
        shell: bash
        env:
          CHUZI_RELEASE_SIGNING_KEY: ${{ secrets.CHUZI_RELEASE_SIGNING_KEY }}
          CHUZI_RELEASE_SIGNER: ${{ vars.CHUZI_RELEASE_SIGNER }}
        run: |
          test -n "$CHUZI_RELEASE_SIGNING_KEY" || { echo 'CHUZI_RELEASE_SIGNING_KEY is required' >&2; exit 1; }
          test -n "$CHUZI_RELEASE_SIGNER" || { echo 'CHUZI_RELEASE_SIGNER repository variable is required' >&2; exit 1; }
      - name: Sign and verify release attestations
        shell: bash
        env:
          CHUZI_RELEASE_SIGNING_KEY: ${{ secrets.CHUZI_RELEASE_SIGNING_KEY }}
          CHUZI_RELEASE_SIGNER: ${{ vars.CHUZI_RELEASE_SIGNER }}
          CHUZI_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/chuzi-release-signing-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$CHUZI_RELEASE_SIGNING_KEY" > "$key_file"
          mkdir -p dist/attestations
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            unsigned="dist/attestations/$name.json"
            signed="dist/attestations/$name.signed.json"
            scripts/generate_release_attestation.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$artifact" "github-actions/$GITHUB_WORKFLOW" "$unsigned"
            scripts/sign_release_attestation.sh "$unsigned" "$key_file" "$CHUZI_RELEASE_SIGNER" "$signed"
            rm -f "$unsigned"
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)
          scripts/verify_release_bundle.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" dist dist/attestations "$CHUZI_RELEASE_REPOSITORY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_assets=()
          while IFS= read -r -d '' asset; do release_assets+=("$asset"); done < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          while IFS= read -r -d '' asset; do release_assets+=("$asset"); done < <(find dist/attestations -maxdepth 1 -type f -name '*.signed.json' -print0 | sort -z)
          [ "${#release_assets[@]}" -gt 0 ] || { echo 'no release assets were produced' >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "chuzi $GITHUB_REF_NAME" --notes-file "releases/$GITHUB_REF_NAME.md" "${release_assets[@]}"
