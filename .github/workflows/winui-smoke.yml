name: winui-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish WinUI client
        shell: pwsh
        run: ./scripts/build_windows_ui.ps1 -Configuration Release -OutputDir "$env:RUNNER_TEMP\chuzi-ui"
      - name: Start published WinUI client
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP\chuzi-ui" -Filter 'chuzi-native-windows-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'WinUI zip was not produced' }
          $root = Join-Path $env:RUNNER_TEMP 'chuzi-ui-extracted'
          Expand-Archive -Path $zip.FullName -DestinationPath $root -Force
          $exe = Get-ChildItem $root -Recurse -Filter 'Chuzi.Native.Windows.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Chuzi.Native.Windows.exe was not found' }
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) {
            throw "WinUI exited during startup with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
